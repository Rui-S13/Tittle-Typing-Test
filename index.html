<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tittle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="header">
        <div id="logo_container">
            <a href="">
                <img src="./assets/tittle-logo.svg" alt="Tittle" height="32">
            </a>
        </div>
        <button id="btn_login">Login</button>
        <a href="" hidden>
            <p class="user_name"></p>
            <p class="user_username"></p>
        </a>
        <button id="btn_logout" hidden>Logout</button>
        <button id="btn_dark_mode">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
    </header>

    <div id="modal" class="modal_overlay" hidden>
        <div class="modal_box">
            <div class="modal_tabs">
                <label for="modal_tab_login">Log In</label>
                <input type="radio" name="modal_tab" id="modal_tab_login" checked>

                <label for="modal_tab_signup">Sign Up</label>
                <input type="radio" name="modal_tab" id="modal_tab_signup">
            </div>

            <form id="modal_login">
                <div class="modal_field">
                    <label for="login_username">Username</label>
                    <input type="text" name="login_username" id="login_username" class="field" required>
                </div>

                <div class="modal_field">
                    <label for="login_password">Password</label>
                    <input type="password" name="login_password" id="login_password" class="field" required>
                </div>

                <button type="submit" id="btn_submit_login">Submit</button>
                <p class="modal_error"></p>
            </form>

            <form id="modal_signup">
                <div class="modal_field">
                    <label for="signup_username">Username</label>
                    <input type="text" name="signup_username" id="signup_username" class="field" required>
                </div>

                <div class="modal_field">
                    <label for="signup_username">Password</label>
                    <input type="password" name="signup_password" id="signup_password" class="field" required>
                </div>

                <button type="submit" id="btn_submit_signup">Submit</button>
                <p class="modal_error"></p>
            </form>
        </div>
    </div>

    <main>
        <section id="typing_test">
            <div id="test_area">
                <div id="test_quote"></div>
                <p id="test_guide">Press ENTER to begin the test</p>
            </div>
            <textarea name="test_input" id="test_input" autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false" disabled></textarea>
        </section>

        <section id="test_status">
            <div id="test_stats">
                <div class="stat">
                    <span class="stat_label">WPM</span>
                    <span id="wpm">---</span>
                </div>

                <div class="stat">
                    <span class="stat_label">Accuracy</span>
                    <span id="accuracy">---</span>
                </div>

                <div class="stat">
                    <span class="stat_label">Errors</span>
                    <span id="errors">---</span>
                </div>
            </div>

            <div id="timer">--:--</div>

            <div id="test_state">Awaiting</div>
        </section>

        <section id="test_settings">
            <h2>Settings</h2>
            <div class="setting_timer">
                <button class="btn_setting" data-timer="30">30 sec</button>
                <button class="btn_setting" data-timer="60">60 sec</button>
                <button class="btn_setting" data-timer="120">120 sec</button>
                <button class="btn_setting" data-timer="quote">Entire quote</button>
            </div>
            <div class="setting_sound">
                <button class="btn_setting" data-sound=true>On</button>
                <button class="btn_setting" data-sound=false>Off</button>
            </div>
        </section>

        <section id="session_top_3">
            <h2>Top tests of this session</h2>
            <ol id="session_top_3_list">

            </ol>
        </section>
    </main>

    <footer>
        <p>Tittle · a typing test that sweats the small stuff.</p>
        <p>
            Built by <a href="https://github.com/Rui-S13">Rui Silva</a>, 2026 ·
            <a href="https://github.com/Rui-S13/tittle-typing-test">Source on GitHub</a>
        </p>
        <p>Quotes from [source]. Your results are stored only in this browser.</p>
        <button type="button" id="btn_back_to_top">Back to top</button>
    </footer>
</body>

</html>
