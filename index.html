<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tittle - Typing Test</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/tittle-icon.svg" type="image/x-icon">
    <script type="module" src="main.js"></script>
</head>

<body>
    <header id="header">
        <div id="logo-container">
            <a href="">
                <svg id="header-logo" viewBox="0 0 280 110" role="img" aria-hidden="true">
                    <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 26H68M43 26V90" />
                        <path d="M97 52V90" />
                        <path d="M127 26V90M110 52H144" />
                        <path d="M167 26V90M150 52H184" />
                        <path d="M203 22V90" />
                        <path d="M226 70H266A20 20 0 1 0 260.1 84.1" />
                    </g>
                    <circle cx="97" cy="29" r="8" fill="var(--accent, #2F5D8A)" />
                </svg>
            </a>
        </div>
        <button id="btn-login">Login</button>
        <a href="" hidden>
            <p class="user-name"></p>
            <p class="user-username"></p>
        </a>
        <button id="btn-logout" hidden>Logout</button>
        <button id="btn-dark-mode">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
    </header>

    <div id="modal" class="modal-overlay" hidden>
        <div class="modal-box">
            <div class="modal-tabs">
                <label for="modal-tab-login">Log In</label>
                <input type="radio" name="modal-tab" id="modal-tab-login" checked>

                <label for="modal-tab-signup">Sign Up</label>
                <input type="radio" name="modal-tab" id="modal-tab-signup">
            </div>

            <form id="modal-login">
                <div class="modal-field">
                    <label for="login-username">Username</label>
                    <input type="text" name="login-username" id="login-username" class="field" required>
                </div>

                <div class="modal-field">
                    <label for="login-password">Password</label>
                    <input type="password" name="login-password" id="login-password" class="field" required>
                </div>

                <button type="submit" id="btn-submit-login">Submit</button>
                <p class="modal-error"></p>
            </form>

            <form id="modal-signup">
                <div class="modal-field">
                    <label for="signup-username">Username</label>
                    <input type="text" name="signup-username" id="signup-username" class="field" required>
                </div>

                <div class="modal-field">
                    <label for="signup-username">Password</label>
                    <input type="password" name="signup-password" id="signup-password" class="field" required>
                </div>

                <button type="submit" id="btn-submit-signup">Submit</button>
                <p class="modal-error"></p>
            </form>
        </div>
    </div>

    <main>
        <section id="typing-test">
            <div id="test-area">
                <div id="test-quote"></div>
                <span id="test-guide"></span>
            </div>
            <div id="quote-info">
                <p id="quote-author"></p>
                <p id="quote-book"></p>
            </div>
            <button id="btn-refresh">
                <svg id="refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4.06189 13C4.02104 12.6724 4 12.3387 4 12
           C4 7.58172 7.58172 4 12 4
           C14.5006 4 16.7332 5.14727 18.2002 6.94416
           M19.9381 11C19.979 11.3276 20 11.6613 20 12
           C20 16.4183 16.4183 20 12 20
           C9.61061 20 7.46589 18.9525 6 17.2916
           M9 17H6V17.2916
           M18.2002 4V6.94416
           M18.2002 6.94416V6.99993L15.2002 7
           M6 20V17.2916" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <kbd id="key-refresh">ESC</kbd>
            </button>
            <textarea name="test-input" id="test-input" autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false"></textarea>
        </section>

        <section id="test-status">
            <div id="test-header">
                <div id="test-state">Awaiting</div>
                <div id="timer">----</div>
            </div>

            <div id="wpm-display">
                <span id="wpm" class="stat-value">---</span>
                <span class="stat-label">WPM</span>
            </div>

            <div id="test-stats">
                <div class="stat">
                    <span class="stat-label">Accuracy</span>
                    <span id="accuracy" class="stat-value">---</span>
                </div>

                <div class="stat">
                    <span class="stat-label">Mistakes</span>
                    <span id="mistakes" class="stat-value">---</span>
                </div>
            </div>
        </section>

        <section id="test-settings">
            <h2>Settings</h2>
            <div id="settings-container">

                <div class="setting">
                    <h3>Timer</h3>
                    <form id="setting-timer" class="setting-option-list">
                        <input type="radio" id="timer-quote" class="setting-input" name="timer" value="false" checked>
                        <label class="btn-setting" for="timer-quote">Off</label>

                        <input type="radio" id="timer-30" class="setting-input" name="timer" value="30">
                        <label class="btn-setting" for="timer-30">30 sec</label>

                        <input type="radio" id="timer-60" class="setting-input" name="timer" value="60">
                        <label class="btn-setting" for="timer-60">60 sec</label>
                    </form>
                </div>

                <div class="setting">
                    <h3>Sound</h3>
                    <form id="setting-sound" class="setting-option-list">
                        <input type="radio" id="sound-off" class="setting-input" name="sound" value="false" checked>
                        <label class="btn-setting" for="sound-off">Off</label>

                        <input type="radio" id="sound-on" class="setting-input" name="sound" value="true">
                        <label class="btn-setting" for="sound-on">On</label>
                    </form>
                </div>
            </div>
        </section>

        <section id="test-history">
            <h2>Test History</h2>
            <div id="history-table-container">
                <table id="test-history-table">
                    <thead class="table-header">
                        <tr>
                            <th>Date</th>
                            <th>WPM</th>
                            <th>Accuracy</th>
                            <th>Mistakes</th>
                        </tr>
                    </thead>
                    <tbody id="test-history-body">
                    </tbody>
                </table>
            </div>
            
        </section>
    </main>

    <footer>
        <div id="footer-brand">
            <svg id="footer-logo" viewBox="0 0 280 110" role="img" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 26H68M43 26V90" />
                    <path d="M97 52V90" />
                    <path d="M127 26V90M110 52H144" />
                    <path d="M167 26V90M150 52H184" />
                    <path d="M203 22V90" />
                    <path d="M226 70H266A20 20 0 1 0 260.1 84.1" />
                </g>
                <circle cx="97" cy="29" r="8" fill="var(--accent, #2F5D8A)" />
            </svg>
            <p>A typing test that sweats the small stuff.</p>
        </div>

        <nav class="footer-links" aria-label="Footer">
            <a href="https://github.com/Rui-S13/tittle-typing-test" target="_blank">Source on GitHub</a>
            <a href="https://github.com/Rui-S13" target="_blank">Rui Silva</a>
            <button type="button" id="btn-back-to-top">Back to top</button>
        </nav>

        <p class="footer-small">
            Built by Rui Silva, 2026. Quotes from <a href="https://www.gutenberg.org/" target="_blank">Project
                Gutenberg</a>. Your results are stored only in this browser.
        </p>
    </footer>
</body>

</html>
